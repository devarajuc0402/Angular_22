<div>
    <h1>Java-Microservices-Angular-UI</h1>
    <h2>Help Service API</h2>

    <button (click)="getHelpMessage()">
      Get Help Message
    </button>

    @if(helpMessage()) {
      <p>Help Message: {{ helpMessage() }}</p>
    }

    @if(errorMessage()) {
      <p>Error Message: {{ errorMessage() }}</p>
    }

</div>
